name: Release PR

on:
  workflow_dispatch:

jobs:
  release-pr:
    uses: stylelint/.github/.github/workflows/call-release-pr.yml@5910d93fe9ed4dfbbd2fba6d456cbc7c91d3106c # 1.3.0
    with:
      new-version-command: 'npm run changeset && npm install --ignore-scripts'
    permissions:
      contents: write
      pull-requests: write
