name: Release PR

on:
  workflow_dispatch:

jobs:
  release-pr:
    uses: stylelint/.github/.github/workflows/call-release-pr.yml@84d33533ebe0929b48fc85479f543fd5d41b221f # 3.0.0
    with:
      new-version-command: 'npm run changeset && npm install --ignore-scripts'
    permissions:
      contents: write
      pull-requests: write
