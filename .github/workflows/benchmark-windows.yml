# Temporary: checks the benchmark's peak-memory preload on Windows. Delete before opening the PR.
name: Benchmark smoke (Windows)

on:
  push:
    branches:
      - refactor-pidusage
  workflow_dispatch:

permissions:
  contents: read

jobs:
  benchmark:
    runs-on: windows-latest
    timeout-minutes: 20
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: '24'
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Run a small benchmark
        run: npm run benchmark -- --sizes=small --iterations=3 --warmup=1 --modes=api,cli
