name: Release

on:
  pull_request:
    branches: [main]
    types: [closed]

jobs:
  release:
    uses: stylelint/.github/.github/workflows/call-release.yml@5910d93fe9ed4dfbbd2fba6d456cbc7c91d3106c # 1.3.0
    with:
      publish-npm-staged: true
    permissions:
      contents: write
      id-token: write
