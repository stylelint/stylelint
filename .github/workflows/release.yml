name: Release

on:
  pull_request:
    branches: [main]
    types: [closed]

jobs:
  release:
    uses: stylelint/.github/.github/workflows/call-release.yml@84d33533ebe0929b48fc85479f543fd5d41b221f # 3.0.0
    with:
      publish-npm-staged: true
    permissions:
      contents: write
      id-token: write
